name: Build MiiFlood
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: |
          apt-get update -qq && apt-get install -y -qq python3 gcc >/dev/null || true
          gcc -std=c11 -O1 -o /tmp/t tests/test_core.c source/rflcore.c
          mkdir -p /tmp/o && /tmp/t /tmp/o && python3 tests/check_db.py /tmp/o
      - name: Build Wii app
        run: make
      - name: Package
        run: |
          mkdir -p dist/apps/MiiFlood/import dist/apps/MiiFlood/backup dist/apps/MiiFlood/archive
          cp boot.dol meta.xml icon.png dist/apps/MiiFlood/
          touch dist/apps/MiiFlood/import/PUT_MII_FILES_HERE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MiiFlood
          path: dist
